.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

.food-card{padding:10px 12px;border-radius:10px;border:1px solid #e8e8e4;background:#fff;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s}

.detail-meta{font-size:12px;color:#999;margin-bottom:12px}

.advice-neg{background:#EAF3DE;color:#3B6D11}
.advice-p1{background:#FAEEDA;color:#854F0B}
.advice-p2{background:#FAECE7;color:#993C1D}

.nightshade-warn{margin-top:8px;padding:9px 11px;border-radius:8px;background:#FAEEDA;color:#854F0B;font-size:13px;line-height:1.6}
.quick-log-btn{margin-top:10px;padding:6px 14px;border:1px solid #e0e0db;border-radius:8px;background:#f7f7f5;color:#555;font-size:13px;cursor:pointer}

.unknown-panel{padding:14px 16px;border:1px dashed #d4d4cf;border-radius:14px;background:#fafaf8;margin-bottom:16px}

.section-title{font-size:12px;font-weight:500;color:#999;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:10px;padding-top:4px}

    <div class="config-steps">
      1. 打开 <a href="https://jsonbin.io" target="_blank">jsonbin.io</a>，注册免费账号<br>
      2. 登录后点击右上角 <strong>API Keys</strong>，复制你的 <strong>Access Key</strong><br>
      3. 点击左侧 <strong>Bins → Create Bin</strong>，内容填 <code>{"logs":[]}</code>，保存<br>
      4. 复制 Bin 的 <strong>BIN ID</strong>（URL 里那串字符）<br>
      5. 把两个值填入下方，点击保存
    </div>
    <div id="configStatus" class="config-status"></div>

    <div class="btn-row">

  </div>

        <option value="⚠️ 轻微反应">⚠️ 轻微反应</option>

      </select>

      <button class="submit-btn" id="submitBtn" onclick="addLog()">
        <i class="ti ti-plus"></i> 添加

    </div>
  </div>

  <div id="logLoading" class="loading" style="display:none"><i class="ti ti-loader-2"></i> 加载记录中...</div>
  <div id="logList"></div>

</div>

// ── 配置 ──────────────────────────────────
function saveConfig() {
  const k = document.getElementById("inputApiKey").value.trim();
  const b = document.getElementById("inputBinId").value.trim();
  
  if (!k || !b) { 
    showConfigStatus("请填写 API Key 和 Bin ID", "error");
    return; 
  }
  
  const btn = document.getElementById("saveConfigBtn");
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2"></i> 验证中...';
  
  // 测试连接
  fetch(`https://api.jsonbin.io/v3/b/${b}/latest`, {
    headers: {"X-Master-Key": k}
  })
  .then(r => {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-check"></i> 保存并连接';
    
    if (!r.ok) {
      if (r.status === 401 || r.status === 403) {
        showConfigStatus("❌ API Key 错误或无权限，请检查后重试", "error");
      } else if (r.status === 404) {
        showConfigStatus("❌ Bin ID 不存在，请检查后重试", "error");
      } else {
        showConfigStatus("❌ 连接失败（HTTP " + r.status + "），请检查网络", "error");
      }
      return;
    }
    
    apiKey = k;
    binId = b;
    cloudConfigured = true;
    localStorage.setItem("jb_api_key", k);
    localStorage.setItem("jb_bin_id", b);
    
    showConfigStatus("✅ 连接成功！数据同步中...", "success");
    setTimeout(() => {
      document.getElementById("configPanel").style.display = "none";
      loadLogs();
    }, 800);
  })
  .catch(e => {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-check"></i> 保存并连接';
    showConfigStatus("❌ 网络错误：" + e.message, "error");
  });
}

function skipConfig() {
  document.getElementById("configPanel").style.display = "none";
  sessionStorage.setItem("config_skipped", "true");
  cloudConfigured = false;
  renderLogs();
}

function resetConfig() {
  localStorage.removeItem("jb_api_key");
  localStorage.removeItem("jb_bin_id");
  apiKey = "";
  binId = "";
  cloudConfigured = false;
  
  document.getElementById("inputApiKey").value = "";
  document.getElementById("inputBinId").value = "";
  document.getElementById("configStatus").style.display = "none";
  
  showError("已清除配置，请重新输入");
}

function showConfigStatus(msg, type) {
  const status = document.getElementById("configStatus");
  status.textContent = msg;
  status.className = "config-status " + type;
  status.style.display = "block";
}

// ── 初始化 ──────────────────────────────────
window.onload = function() {
  // 决定是否显示配置面板
  const hasConfig = apiKey && binId;
  const showConfig = !hasConfig && !sessionStorage.getItem("config_skipped");
  
  if (showConfig) {
    document.getElementById("configPanel").style.display = "block";
  }
  
  buildTabs();
  renderGrid("");
  
  if (hasConfig) {
    loadLogs();
  } else {
    renderLogs();
  }
};

function buildTabs() {
  const bar = document.getElementById("tabBar");
  CATS.forEach(c => {
    const t = document.createElement("div");
    t.className = "tab" + (c === activeTab ? " active" : "");
    t.textContent = c;
    t.onclick = () => {
      activeTab = c;
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      renderGrid(document.getElementById("searchInput").value.trim());
    };
    bar.appendChild(t);
  });
}

// ── 查询 ──────────────────────────────────
function onSearch() { renderGrid(document.getElementById("searchInput").value.trim()); }
function clearSearch() {
  document.getElementById("searchInput").value = "";
  document.getElementById("detailPanel").style.display = "none";
  document.getElementById("unknownPanel").style.display = "none";
  renderGrid("");
}

function renderGrid(q) {
  const grid = document.getElementById("resultGrid");
  const unk = document.getElementById("unknownPanel");
  grid.innerHTML = ""; unk.style.display = "none";
  let foods = ALL_FOODS;
  if (activeTab !== "全部") foods = foods.filter(f => f.cat === activeTab);
  if (q) foods = foods.filter(f => f.name.includes(q) || f.cat.includes(q));
  if (q && foods.length === 0) { showUnknown(q); return; }
  if (q && foods.length === 1) showDetail(foods[0]);
  [...foods].sort((a,b) => b.lvl - a.lvl || b.val - a.val).forEach(f => {
    const info = LVL[f.lvl];
    const d = document.createElement("div");
    d.className = "food-card";
    d.innerHTML = `<div class="food-name">${f.name}</div><div class="food-meta">${f.cat} · ${f.gt?">":""}${f.val.toFixed(1)} U/ml</div><span class="badge ${info.badge}">${info.label}</span>`;
    d.onclick = () => showDetail(f);
    grid.appendChild(d);
  });
}

function showDetail(f) {
  const p = document.getElementById("detailPanel");
  const info = LVL[f.lvl];
  const isNight = NIGHTSHADE.includes(f.name);
  p.style.display = "block";
  p.innerHTML = `
    <div class="detail-panel">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <h2>${f.name} <span class="badge ${info.badge}">${info.label}</span></h2>
          <p class="detail-meta">${f.cat} &nbsp;·&nbsp; IgG ${f.gt?">":""}${f.val.toFixed(1)} U/ml &nbsp;·&nbsp; 检测：2026-03-01</p>
        </div>
        <button onclick="document.getElementById('detailPanel').style.display='none'" style="background:none;border:none;font-size:20px;color:#bbb;cursor:pointer;padding:0">×</button>
      </div>
      <div class="advice-box advice-${info.badge}"><i class="ti ti-info-circle"></i>&nbsp;${info.advice}</div>
      ${isNight ? `<div class="nightshade-warn"><i class="ti ti-alert-triangle"></i>&nbsp;属于茄科家族，建议在肠道修复期整个茄科（番茄、土豆、茄子、辣椒）一并回避。</div>` : ""}
      <button class="quick-log-btn" onclick="prefillLog('${f.name}')"><i class="ti ti-pencil"></i> 记录「${f.name}」的观察</button>
    </div>`;
}

function showUnknown(q) {
  const unk = document.getElementById("unknownPanel");
  unk.style.display = "block";
  const isNight = NIGHTSHADE.includes(q);
  unk.innerHTML = `
    <div class="unknown-panel">
      <h3>「${q}」不在90项检测范围内</h3>
      <p>该食物未经IgG检测，无法判断不耐受级别。建议少量尝试并观察24–48小时内的皮肤、消化道反应，记录在下方。如反应明显，可纳入下次复查。</p>
      ${isNight ? `<p style="margin-top:8px;padding:8px 10px;border-radius:8px;background:#FAEEDA;color:#854F0B;font-size:13px;"><i class="ti ti-alert-triangle"></i>&nbsp;「${q}」属于茄科食材，建议检查相关成分，谨慎尝试。</p>` : ""}
      <button class="quick-log-btn" style="margin-top:10px" onclick="prefillLog('${q}')"><i class="ti ti-pencil"></i> 记录「${q}」的观察</button>
    </div>`;
}

function prefillLog(name) {
  document.getElementById("logFood").value = name;
  document.getElementById("logFood").scrollIntoView({behavior:"smooth", block:"center"});
  setTimeout(() => document.getElementById("logFood").focus(), 400);
}

// ── 记录（JSONBin） ──────────────────────────────────
async function loadLogs() {
  if (!apiKey || !binId) { renderLogs(); return; }
  document.getElementById("logLoading").style.display = "block";
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: {"X-Master-Key": apiKey}
    });
    if (!r.ok) throw new Error("读取失败 HTTP " + r.status);
    const data = await r.json();
    logs = data.record.logs || [];
  } catch(e) {
    showError("云端记录加载失败：" + e.message + "。已切换到本地模式，可点击「重新配置」重试。");
    cloudConfigured = false;
  }
  document.getElementById("logLoading").style.display = "none";
  renderLogs();
}

async function saveLogs() {
  if (!apiKey || !binId) return;
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json","X-Master-Key": apiKey},
      body: JSON.stringify({logs})
    });
    if (!r.ok) throw new Error("保存失败 HTTP " + r.status);
    return true;
  } catch(e) {
    console.error("SaveLogs error:", e);
    return false;
  }
}

async function addLog() {
  const food = document.getElementById("logFood").value.trim();
  const note = document.getElementById("logNote").value.trim();
  const reaction = document.getElementById("logReaction").value;
  const author = document.getElementById("logAuthor").value.trim() || "家人";
  if (!food) { document.getElementById("logFood").focus(); return; }
  
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; 
  btn.innerHTML = '<i class="ti ti-loader-2"></i> 保存中...';
  
  const entry = {
    id: Date.now(), food, note, reaction, author,
    date: new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"})
  };
  logs.unshift(entry);
  
  let saveSuccess = false;
  if (cloudConfigured) {
    saveSuccess = await saveLogs();
  } else {
    // 本地模式：存到 localStorage 备份
    saveSuccess = true;
  }
  
  try { 
    localStorage.setItem("yuqi_logs_backup", JSON.stringify(logs)); 
  } catch(e){}
  
  if (!saveSuccess && cloudConfigured) {
    showError("云端保存失败，记录已保存到本地浏览器，可稍后重新配置后同步。");
    cloudConfigured = false;
  }
  
  document.getElementById("logFood").value = "";
  document.getElementById("logNote").value = "";
  document.getElementById("logReaction").value = "✅ 正常";
  btn.disabled = false; 
  btn.innerHTML = '<i class="ti ti-plus"></i> 添加';
  renderLogs();
}

async function deleteLog(id) {
  if (!confirm("确认删除这条记录？")) return;
  logs = logs.filter(l => l.id !== id);
  
  if (cloudConfigured) {
    const success = await saveLogs();
    if (!success) {
      showError("云端删除失败，记录已在本地删除");
    }
  }
  
  try { 
    localStorage.setItem("yuqi_logs_backup", JSON.stringify(logs)); 
  } catch(e){}
  
  renderLogs();
}

function renderLogs() {
  const list = document.getElementById("logList");
  if (logs.length === 0) {
    list.innerHTML = `<div class="empty-state"><i class="ti ti-notes" style="font-size:24px;display:block;margin-bottom:8px;color:#ddd"></i>还没有观察记录</div>`;
    return;
  }
  const rCls = {"✅ 正常":"neg","⚠️ 轻微反应":"p1","🔶 明显反应":"p2","🔴 严重反应":"p3"};
  list.innerHTML = logs.map(l => `
    <div class="log-entry">
      <div class="log-entry-top">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="log-food-name">${l.food}</span>
          <span class="badge ${rCls[l.reaction]||"neg"}" style="font-size:11px">${l.reaction}</span>
        </div>
        <button class="del-btn" onclick="deleteLog(${l.id})" title="删除"><i class="ti ti-trash"></i></button>
      </div>
      ${l.note ? `<p class="log-note">${l.note}</p>` : ""}
      <p class="log-author">${l.date} &nbsp;·&nbsp; ${l.author||"家人"}</p>
    </div>`).join("");
}

function showError(msg) {
  const b = document.getElementById("errorBanner");
  const t = document.getElementById("errorText");
  t.textContent = msg;
  b.style.display = "flex";
  setTimeout(() => b.style.display = "none", 8000);
}
</script>
